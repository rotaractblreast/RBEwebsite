welcomeSection:
  - title: UNITE
    icon: flaticon-profile
    brief: We are a family, and family means no one gets left behind or forgotten.
    target: /news
  - title: RISE
    icon: flaticon-diamond
    brief: With unity, we rise by learning from each other in the true spirit of Rotaract.
    target: /news
  - title: EMPOWER
    icon: flaticon-donation
    brief: With unity, we rise and empower the community around us.
    target: /news

coreValues:
  - title: UNITE
    brief: We are a family - no one gets left behind or forgotten.
    image: /images/site/about.jpg
    target: /join
  - title: RISE
    brief: With unity we rise by learning from each other's spirit of Rotaract.
    image: /images/site/eastpeacerun.jpg
    target: /events
  - title: EMPOWER
    brief: With unity we rise and empower the community around us.
    image: /images/site/feature-5.jpeg
    target: /causes

areasoffocus:
  - title: Promoting peace
    icon: flaticon-support
    description: Rotary encourages conversations to foster understanding within and across cultures.
  - title: Fighting disease
    icon: flaticon-doctor
    description: We educate and equip communities to stop the spread of life-threatening diseases.
  - title: Providing clean water, sanitation, and hygiene
    icon: flaticon-blood
    description: We support local solutions to bring clean water, sanitation, and hygiene to more people every day.
  - title: Saving mothers and children
    icon: flaticon-favorite
    description: We expand access to quality care, so mothers and their children can live and grow stronger.
  - title: Supporting education
    icon: flaticon-agenda
    description: We support basic education and literacy, reduce gender disparity in education, and increase adult literacy.
  - title: Growing local economies
    icon: flaticon-suitcase
    description: We carry out service projects that enhance economic and community development and create opportunities for decent and productive work for young and old.
  - title: Protecting the environment
    icon: flaticon-circle
    description: We tackle environmental issues seriously and work towards the betterment of the community around us.

