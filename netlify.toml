[build]
  # Netlify already runs `npm ci` (from package-lock.json) in its dependency phase
  # with cache - do not repeat it here.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Sanity is the content source of truth. Unset / omit USE_FS_CONTENT (do not set to "1").
  # Both values are public (they ship in the client bundle), so pin them here rather than
  # relying on site env vars - a missing project id fails the build.
  PUBLIC_SANITY_PROJECT_ID = "t6bu0f9m"
  PUBLIC_SANITY_DATASET = "production"
  # Apps Script Web App /exec URL (public write-only). Join form POSTs here at runtime.
  PUBLIC_FORMS_API_URL = "https://script.google.com/macros/s/AKfycbwchW0c5HpKBvqSuhtownO-xtqGEoo3qtjo73CSmVvQINpNptmy_DMlkb5gq36Zoun1/exec"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "0"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/connect/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/connect-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/connect-manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Critical host / path redirects only.
# Do NOT add trailing-slash canonicals like /about → /about/: with force=true,
# Netlify matches both /about and /about/ and loops (ERR_TOO_MANY_REDIRECTS).
# Astro trailingSlash: "always" already emits .../index.html; Netlify serves /about/ natively.

[[redirects]]
  from = "https://rotaractblreast.netlify.com/*"
  to = "https://rotaractblreast.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/feed.xml"
  to = "/rss.xml"
  status = 301

# Legacy: /thankyou was the Google Forms landing page. Forms now confirm inline,
# so the page is gone - keep old links/bookmarks off a 404.
[[redirects]]
  from = "/thankyou"
  to = "/"
  status = 301
